version: '3.8'

services:
  # 1. MySQL 데이터베이스 설정
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234  # root 비밀번호 설정
      MYSQL_DATABASE: db_memberboard     # 사용할 데이터베이스 이름
      MYSQL_USER: memberboard            # 사용자 이름
      MYSQL_PASSWORD: 1234               # 사용자 비밀번호
    ports:
      - "3307:3306"  # MySQL 기본 포트 매핑
    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql  # MySQL 데이터 영속성을 위해 볼륨 설정

  # 2. Spring Boot 애플리케이션 설정
  springboot-app:
    build:
      context: .  # Dockerfile 위치
    container_name: springboot-app
    ports:
      - "8080:8080"  # 애플리케이션 포트 매핑
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/db_memberboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: memberboard
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - mysql  # Spring Boot 애플리케이션은 MySQL이 준비된 후에 실행
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local