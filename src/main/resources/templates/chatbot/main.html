<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/layout-sample}">

<head>
    <title>챗봇</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="/css/chatbot.css">
</head>

<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-8 offset-md-2">
                <div class="header">
                    <h2>챗봇과 대화하기</h2>
                    <button id="song-recommendation-button" class="btn btn-success ml-auto">감정 분석하기</button>
                </div>
                <div class="row mt-4">
                    <div class="col-12 portlet">
                        <div class="chatbox" id="chatbox">
                            <div id="chat-area">
                                <div class="message bot-message">
                                    <p><strong>봇:</strong> 오늘 무슨 일이 있으셨나요?</p>
                                </div>
                            </div>
                            <div class="input-area">
                                <label for="user-input"></label>
                                <input type="text" id="user-input" class="form-control" placeholder="메시지를 입력하세요..." />
                                <button class="btn btn-primary" id="send-button">전송</button>
                                <button class="btn btn-secondary" id="reset-button">리셋</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/chatbot.js"></script>
</th:block>

</body>
</html>
